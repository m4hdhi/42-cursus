[www]
user = www-data
group = www-data

; Listen on TCP port 9000 (instead of a unix socket) so that nginx,
; in another container, can reach php-fpm through the Docker network
listen = 9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Send PHP worker errors to the container logs
catch_workers_output = yes
