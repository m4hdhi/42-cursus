server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMAIN_NAME;

    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WordPress files, shared with the wordpress container through the volume
    root  /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Bonus: static resume site, served by the "website" container.
    # ^~ makes this prefix win over the .php regex below.
    location ^~ /resume/ {
        proxy_pass http://website:8080/;
    }

    # PHP files are executed by php-fpm in the wordpress container (port 9000)
    location ~ \.php$ {
        include       fastcgi_params;
        fastcgi_pass  wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
